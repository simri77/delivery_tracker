services:
  postgres:
    image: postgres:15-alpine
    container_name: delivery_tracker_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: delivery_tracker
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app-network

  api:
    build: .
    container_name: delivery_tracker_api
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql://postgres:secretpassword@postgres:5432/delivery_tracker?schema=public
      - PORT=5000
    depends_on:
      - postgres
    networks:
      - app-network

volumes:
  pgdata:

networks:
  app-network:
    driver: bridge